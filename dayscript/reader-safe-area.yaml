# The vertical margin (15% of the page by default, never less than the safe areas) bounds the
# chapter's pages. Verify complete pages, stable control toggles, and that a taller footer leaves
# the margins as they are.
flow:
  - navigate: { route: library }
  - select: { id: library_folders, index: 1 }
  - wait_for: { id: library_list }
  - input: { id: library_search, text: Alice }
  - select: { id: library_list, index: 0 }
  - wait_for: { id: open_local_book }
  - tap: { id: open_local_book }
  - wait_for: { id: book_webview, timeout_secs: 30 }
  - web_eval: { id: book_webview, script: "String(stanza.state().ready)", text: "true", timeout_secs: 40 }
  - web_eval: { id: book_webview, script: "stanza.goToChapter(2);true", text: "true" }
  - web_eval: { id: book_webview, script: "String(stanza.state().ready && stanza.state().chapter===2 && !stanza.state().animating)", text: "true" }
  - web_eval: { id: book_webview, script: "window.checkInsets=()=>{const f=document.getElementById('book'),s=getComputedStyle(f.contentDocument.documentElement),p=document.createElement('div');p.style.cssText='position:fixed;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)';document.body.append(p);const e=getComputedStyle(p),top=Math.round(Math.max(parseFloat(e.paddingTop)||0,0.15*f.clientHeight)),bottom=Math.round(Math.max(parseFloat(e.paddingBottom)||0,0.15*f.clientHeight));p.remove();return Math.abs(parseFloat(s.paddingTop)-top)<=1 && Math.abs(parseFloat(s.paddingBottom)-bottom)<=1};String(checkInsets())", text: "true" }
  - screenshot: { name: reader-safe-area-first-page }
  - web_eval: { id: book_webview, script: "stanza.next();true", text: "true" }
  - web_eval: { id: book_webview, script: "String(stanza.state().ready && !stanza.state().animating && stanza.state().page===1 && checkInsets())", text: "true" }
  - screenshot: { name: reader-safe-area-next-page }
  - web_eval: { id: book_webview, script: "window.pageBeforeHide=stanza.state().page;window.pagesBeforeHide=stanza.state().pages;document.getElementById('book').contentDocument.body.dispatchEvent(new MouseEvent('click',{bubbles:true,clientX:innerWidth/2,clientY:innerHeight/2}));String(!stanza.state().controls)", text: "true" }
  - web_eval: { id: book_webview, script: "document.getElementById('book').contentDocument.body.dispatchEvent(new MouseEvent('click',{bubbles:true,clientX:innerWidth/2,clientY:innerHeight/2}));String(stanza.state().controls && stanza.state().page===pageBeforeHide && stanza.state().pages===pagesBeforeHide && checkInsets())", text: "true" }
  - web_eval: { id: book_webview, script: "var s=document.getElementById('chapter-progress');s.value='1000';s.dispatchEvent(new Event('change'));true", text: "true" }
  - web_eval: { id: book_webview, script: "String(stanza.state().ready && !stanza.state().animating && stanza.state().page===stanza.state().pages-1 && checkInsets())", text: "true" }
  - screenshot: { name: reader-safe-area-last-page }
  - web_eval: { id: book_webview, script: "window.footerPadding=document.getElementById('footer').style.paddingBottom;document.getElementById('footer').style.paddingBottom=(parseFloat(getComputedStyle(document.getElementById('footer')).paddingBottom)+40)+'px';true", text: "true" }
  - web_eval: { id: book_webview, script: "String(stanza.state().ready && checkInsets())", text: "true" }
  - web_eval: { id: book_webview, script: "document.getElementById('footer').style.paddingBottom=footerPadding;true", text: "true" }
  - web_eval: { id: book_webview, script: "String(stanza.state().ready && checkInsets())", text: "true" }
  # Leave the app where it started: web runs the next script in this same page.
  - web_eval: { id: book_webview, script: "setTimeout(()=>document.getElementById('close-reader').click(),500);true", text: "true" }
  - assert_missing: { id: book_webview }
  - nav_back: { only_on: [uikit, mdc, gtk, qt, xaml, winui, arkui, dom] }
  - nav_back: {}
  - wait_for: { id: library_folders }
