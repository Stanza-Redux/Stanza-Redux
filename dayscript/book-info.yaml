flow:
  - navigate: { route: catalogs }
  - menu: { id: add_opds_catalog }
  - wait_for: { id: catalog_editor_url }
  - input: { id: catalog_editor_url, text: 'http://127.0.0.1:18765/rich' }
  - tap: { id: catalog_editor_validate }
  - wait_for: { id: catalog_editor_valid, timeout_secs: 30 }
  # Native blur/commit may echo an unchanged URL after validation. It must stay valid.
  - input: { id: catalog_editor_url, text: 'http://127.0.0.1:18765/rich' }
  - wait_for: { id: catalog_editor_valid }
  - tap: { id: catalog_editor_save }
  - assert_missing: { id: catalog_editor }
  - wait_for: { id: catalog_list:1-Book%20collection }
  - assert_text: { id: 'catalog_cover:46-http%3A%2F%2F127.0.0.1%3A18765%2Fcover.jpg', text: '' }
  - screenshot: { name: book-list }
  - select: { id: catalog_list:1-Book%20collection, index: 0 }
  - assert_visible: { id: publication_title }
  - screenshot: { name: remote-book-overview }
  - scroll_to: { id: book_metadata }
  - screenshot: { name: remote-book-metadata }
  - nav_back: { native: true, only_on: [uikit, mdc] }
  - nav_back: { native: true, only_on: [uikit, mdc] }
  - navigate: { route: library }
  - select: { id: library_folders, index: 1 }
  - wait_for: { id: library_list }
  - input: { id: library_search, text: Alice }
  - select: { id: library_list, index: 0 }
  - wait_for: { id: book_metadata }
  - screenshot: { name: local-book-overview }
  - tap: { id: open_local_book }
  - wait_for: { id: book_webview }
  - web_eval: { id: book_webview, script: "String(stanza.state().ready)", text: "true", timeout_secs: 40 }
  - web_eval: { id: book_webview, script: "setTimeout(()=>document.getElementById('appearance').click(),500);true", text: "true" }
  - wait_for: { id: reader_justified }
  - toggle: { id: reader_justified, value: true }
  - toggle: { id: reader_hyphenation, value: false }
  - screenshot: { name: reader-typography }
  - scroll_to: { id: paragraph_spacing }
  - set_value: { id: paragraph_spacing, value: 1.2 }
  - screenshot: { name: reader-layout }
  - tap: { id: reader_settings_done }
  - wait_for: { id: book_webview }
  - web_eval: { id: book_webview, script: "String(stanza.state().ready)", text: "true", timeout_secs: 40 }
  - web_eval: { id: book_webview, script: "String(document.querySelector('#book').contentDocument.documentElement.style.getPropertyValue('--USER__textAlign')==='justify')", text: "true" }
  - web_eval: { id: book_webview, script: "String(document.querySelector('#book').contentDocument.documentElement.style.getPropertyValue('--USER__bodyHyphens')==='none')", text: "true" }
  - web_eval: { id: book_webview, script: "setTimeout(()=>document.getElementById('close-reader').click(),500);true", text: "true" }
  - assert_missing: { id: book_webview }
  - nav_back: { only_on: [uikit, mdc, gtk, qt, xaml, arkui, dom] }
  - nav_back: {}
  - wait_for: { id: library_folders }
  - navigate: { route: settings }
  - wait_for: { id: settings_root }
  - screenshot: { name: settings-page }
  - navigate: { route: settings/general }
  - wait_for: { id: language_picker }
  # Leave Settings at its root: a later `navigate: settings` keeps the section's stack.
  - nav_back: { only_on: [uikit, mdc, arkui, dom] }
  - close_window: { window: day.preferences }
  - navigate: { route: catalogs }
  - menu: { id: manage_catalogs_menu }
  - wait_for: { id: 'catalog_row:http%3A%2F%2F127.0.0.1%3A18765%2Frich' }
  - context_menu: { id: 'catalog_row:http%3A%2F%2F127.0.0.1%3A18765%2Frich', item_id: catalog_remove }
  - nav_back: {}
