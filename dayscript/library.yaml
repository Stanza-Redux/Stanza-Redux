flow:
  - navigate: { route: library }
  - wait_for: { id: library_folders }
  - screenshot: { name: library-folders }
  - select: { id: library_folders, index: 1 }
  - wait_for: { id: library_list }
  - input: { id: library_search, text: Alice }
  - assert_missing: { id: library_empty }
  - select: { id: library_list, index: 0 }
  - wait_for: { id: open_local_book }
  - tap: { id: open_local_book }
  - wait_for: { id: book_webview, timeout_secs: 30 }
  - web_eval: { id: book_webview, script: "String(stanza.state().ready)", text: "true", timeout_secs: 40 }
  - web_eval: { id: book_webview, script: "setTimeout(()=>document.getElementById('close-reader').click(),300);true", text: "true" }
  - assert_missing: { id: book_webview }
  - nav_back: { only_on: [uikit, material, gtk, qt, xaml, arkui, dom] }
  - nav_back: {}
  - select: { id: library_folders, index: 0 }
  - wait_for: { id: library_list }
  - screenshot: { name: library-recents }
  - select: { id: library_list, index: 0 }
  - wait_for: { id: local_book_title }
  - wait_for: { id: book_metadata }
  - screenshot: { name: library-overview }
  - tap: { id: open_local_book }
  - wait_for: { id: book_webview }
  - web_eval: { id: book_webview, script: "String(stanza.state().ready)", text: "true", timeout_secs: 40 }
  - web_eval: { id: book_webview, script: "setTimeout(()=>document.getElementById('close-reader').click(),300);true", text: "true" }
  - assert_missing: { id: book_webview }
  - nav_back: { only_on: [uikit, material, gtk, qt, xaml, arkui, dom] }
  - nav_back: {}
  - wait_for: { id: library_folders }
  - select: { id: library_folders, index: 2 }
  - wait_for: { id: library_authors }
  - screenshot: { name: library-authors }
  - select: { id: library_authors, index: 0 }
  - wait_for: { id: library_list }
  - screenshot: { name: library-author-books }
  - nav_back: {}
  - nav_back: {}
  - select: { id: library_folders, index: 3 }
  - wait_for: { id: library_genres }
  - screenshot: { name: library-genres }
  - select: { id: library_genres, index: 0 }
  - wait_for: { id: library_list }
  - screenshot: { name: library-genre-books }
  - nav_back: {}
  - nav_back: {}
  - select: { id: library_folders, index: 1 }
  - wait_for: { id: library_list }
  - input: { id: library_search, text: NoSuchFixtureBook }
  - screenshot: { name: library-empty-search }
  - input: { id: library_search, text: Alice }
  - assert_missing: { id: library_empty }
  - select: { id: library_list, index: 0 }
  - wait_for: { id: open_local_book }
  - screenshot: { name: library-title-search }
  - nav_back: { only_on: [uikit, material, gtk, qt, xaml, arkui, dom] }
  - nav_back: {}
  - navigate: { route: settings/general }
  - wait_for: { id: language_picker }
  - select: { id: language_picker, index: 5 }
  - navigate: { route: library }
  - assert_visible: { id: library_folders }
  - screenshot: { name: library-french }
