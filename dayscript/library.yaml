flow:
  - navigate: { route: library }
  - wait_for: { id: library-folders }
  - screenshot: { name: library-folders }
  - select: { id: library-folders, index: 1 }
  - wait_for: { id: library-list }
  - input: { id: library-search, text: Alice }
  - assert_missing: { id: library-empty }
  - select: { id: library-list, index: 0 }
  - wait_for: { id: open-local-book }
  - tap: { id: open-local-book }
  - wait_for: { id: book-webview, timeout_secs: 30 }
  - web_eval: { id: book-webview, script: "String(stanza.state().ready)", text: "true", timeout_secs: 40 }
  - web_eval: { id: book-webview, script: "setTimeout(()=>document.getElementById('close-reader').click(),300);true", text: "true" }
  - assert_missing: { id: book-webview }
  - nav_back: { only_on: [uikit, mdc, gtk, qt, xaml, arkui, dom] }
  - nav_back: {}
  - select: { id: library-folders, index: 0 }
  - wait_for: { id: library-list }
  - screenshot: { name: library-recents }
  - select: { id: library-list, index: 0 }
  - wait_for: { id: local-book-title }
  - wait_for: { id: book-metadata }
  - screenshot: { name: library-overview }
  - tap: { id: open-local-book }
  - wait_for: { id: book-webview }
  - web_eval: { id: book-webview, script: "String(stanza.state().ready)", text: "true", timeout_secs: 40 }
  - web_eval: { id: book-webview, script: "setTimeout(()=>document.getElementById('close-reader').click(),300);true", text: "true" }
  - assert_missing: { id: book-webview }
  - nav_back: { only_on: [uikit, mdc, gtk, qt, xaml, arkui, dom] }
  - nav_back: {}
