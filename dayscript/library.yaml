  - wait_for: { id: library-authors }
  - screenshot: { name: library-authors }
  - select: { id: library-authors, index: 0 }
  - wait_for: { id: library-list }
  - screenshot: { name: library-author-books }
  - nav_back: {}
  - nav_back: {}
  - select: { id: library-folders, index: 3 }
  - wait_for: { id: library-genres }
  - screenshot: { name: library-genres }
  - select: { id: library-genres, index: 0 }
