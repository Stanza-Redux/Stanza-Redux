# tests/catalog_server.py supplies delayed, distinct covers for 120 books.
flow:
  - navigate: { route: catalogs }
  - menu: { id: add_opds_catalog }
  - wait_for: { id: catalog_editor_url }
  - input: { id: catalog_editor_url, text: 'http://127.0.0.1:18765/many' }
  - tap: { id: catalog_editor_validate }
  - wait_for: { id: catalog_editor_valid, timeout_secs: 30 }
  - tap: { id: catalog_editor_save }
  - assert_missing: { id: catalog_editor }
  - wait_for: { id: catalog_list:1-Thumbnail%20stress }
  - wait_for: { id: 'catalog_placeholder:46-http%3A%2F%2F127.0.0.1%3A18765%2Fcovers%2F0.png' }
  - screenshot: { name: thumbnails-loading }
  - wait_for: { id: 'catalog_cover:46-http%3A%2F%2F127.0.0.1%3A18765%2Fcovers%2F0.png' }
  - wait_for: { id: 'catalog_cover:46-http%3A%2F%2F127.0.0.1%3A18765%2Fcovers%2F1.png' }
  - wait_for: { id: 'catalog_cover:46-http%3A%2F%2F127.0.0.1%3A18765%2Fcovers%2F2.png' }
  - screenshot: { name: thumbnails-loaded }
  - menu: { id: manage_catalogs_menu }
  - wait_for: { id: 'catalog_row:http%3A%2F%2F127.0.0.1%3A18765%2Fmany' }
  - context_menu: { id: 'catalog_row:http%3A%2F%2F127.0.0.1%3A18765%2Fmany', item_id: catalog_remove }
  - nav_back: {}
