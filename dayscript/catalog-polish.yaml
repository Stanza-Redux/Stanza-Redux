# Synthetic local fixture; no external catalog or user library data is changed.
flow:
  - navigate: { route: catalogs }
  - screenshot: { name: catalog-discovery }
  - menu: { id: add_opds_catalog }
  - wait_for: { id: catalog_editor_url }
  - input: { id: catalog_editor_url, text: 'http://127.0.0.1:18765/retry-fixture' }
  - tap: { id: catalog_editor_validate }
  - wait_for: { id: catalog_editor_valid, timeout_secs: 30 }
  - tap: { id: catalog_editor_save }
  - wait_for: { id: catalog_list:1-Recovery%20fixture }
  - wait_for: { id: 'catalog_cover:32-http%3A%2F%2F127.0.0.1%3A18765%2Ffavicon.ico' }
  - toolbar: { item: catalog_refresh }
  - wait_for: { id: catalog_list:1-Recovery%20fixture }
  - select: { id: catalog_list:1-Recovery%20fixture, index: 0 }
  - wait_for: { id: catalog_error }
  - assert_visible: { id: catalog_retry }
  - tap: { id: catalog_retry }
  - wait_for: { id: catalog_list:2-Recovered%20catalog }
  - assert_visible: { id: catalog_empty }
  - assert_missing: { id: catalog_error }
  - screenshot: { name: catalog-recovered }
  - nav_back: {}
  - assert_visible: { id: catalog_list:1-Recovery%20fixture }
  - select: { id: catalog_list:1-Recovery%20fixture, index: 1 }
  - wait_for: { id: catalog_list:2-Empty%20catalog }
  - assert_visible: { id: catalog_empty }
  - nav_back: {}
  - nav_back: {}
  - assert_visible: { id: catalog_sources }
  - toolbar: { item: manage_catalogs }
  - context_menu: { id: 'catalog_row:http%3A%2F%2F127.0.0.1%3A18765%2Fretry-fixture', item_id: catalog_remove }
  - nav_back: {}
