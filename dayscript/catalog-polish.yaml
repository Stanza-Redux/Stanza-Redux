# Synthetic local fixture; no external catalog or user library data is changed.
flow:
  - navigate: { route: catalogs }
  - screenshot: { name: catalog-discovery }
  - menu: { id: add-opds-catalog }
  - wait_for: { id: catalog-editor-url }
  - input: { id: catalog-editor-url, text: 'http://127.0.0.1:18765/retry-fixture' }
  - tap: { id: catalog-editor-validate }
  - wait_for: { id: catalog-editor-valid, timeout_secs: 30 }
  - tap: { id: catalog-editor-save }
  - wait_for: { id: catalog-list-1-Recovery fixture }
  - wait_for: { id: 'catalog-cover-32-http://127.0.0.1:18765/favicon.ico' }
  - toolbar: { item: catalog-refresh }
  - wait_for: { id: catalog-list-1-Recovery fixture }
  - select: { id: catalog-list-1-Recovery fixture, index: 0 }
  - wait_for: { id: catalog-error }
  - assert_visible: { id: catalog-retry }
  - tap: { id: catalog-retry }
  - wait_for: { id: catalog-list-2-Recovered catalog }
  - assert_visible: { id: catalog-empty }
  - assert_missing: { id: catalog-error }
  - screenshot: { name: catalog-recovered }
  - nav_back: {}
  - assert_visible: { id: catalog-list-1-Recovery fixture }
  - select: { id: catalog-list-1-Recovery fixture, index: 1 }
  - wait_for: { id: catalog-list-2-Empty catalog }
  - assert_visible: { id: catalog-empty }
  - nav_back: {}
  - nav_back: {}
  - assert_visible: { id: catalog-sources }
  - toolbar: { item: manage-catalogs }
  - tap: { id: 'catalog-remove-http://127.0.0.1:18765/retry-fixture' }
  - toolbar: { item: catalog-manager-done }
