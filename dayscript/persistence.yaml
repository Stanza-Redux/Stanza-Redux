# The chapter-only query must be answered by Day FTS, not a title/author substring filter.
flow:
  - navigate: { route: library }
  - wait_for: { id: library_folders }
  - select: { id: library_folders, index: 1 }
  - wait_for: { id: library_list }
  - input: { id: library_search, text: waistcoat }
  - assert_missing: { id: library_empty }
  - select: { id: library_list, index: 0 }
  - wait_for: { id: local_book_title }
  - assert_text: { id: local_book_title, text: "Alice's Adventures in Wonderland" }
  - screenshot: { name: persistence-chapter-search }
  - nav_back: { only_on: [uikit, mdc, gtk, qt, xaml, arkui, dom] }
  - input: { id: library_search, text: Carroll }
  - assert_missing: { id: library_empty }
  - input: { id: library_search, text: fantasy }
  - assert_missing: { id: library_empty }
  - input: { id: library_search, text: 'title:NoSuchFixture' }
  - wait_for: { id: library_empty }
  - input: { id: library_search, text: Alice }
  - assert_missing: { id: library_empty }
  - select: { id: library_list, index: 0 }
  - wait_for: { id: open_local_book }
  - tap: { id: open_local_book }
  - wait_for: { id: book_webview, timeout_secs: 30 }
  - web_eval: { id: book_webview, script: "String(stanza.state().ready)", text: "true", timeout_secs: 40 }
  - web_eval: { id: book_webview, script: "setTimeout(()=>document.getElementById('close-reader').click(),300);true", text: "true" }
  - assert_missing: { id: book_webview }
  - nav_back: { only_on: [uikit, mdc, gtk, qt, xaml, arkui, dom] }
  - nav_back: {}
  - select: { id: library_folders, index: 0 }
  - wait_for: { id: library_list }
  - assert_missing: { id: library_empty }
  - select: { id: library_list, index: 0 }
  - wait_for: { id: local_book_title }
  - screenshot: { name: persistence-recents }
  - nav_back: { only_on: [uikit, mdc, gtk, qt, xaml, arkui, dom] }
  - nav_back: {}
