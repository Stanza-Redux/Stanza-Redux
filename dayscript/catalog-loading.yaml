flow:
  - navigate: { route: catalogs }
  - menu: { id: add_opds_catalog }
  - wait_for: { id: catalog_editor_url }
  - input: { id: catalog_editor_url, text: 'http://127.0.0.1:18765/loading-fixture' }
  - tap: { id: catalog_editor_validate }
  - wait_for: { id: catalog_editor_valid, timeout_secs: 30 }
  - tap: { id: catalog_editor_save }
  - assert_missing: { id: catalog_editor }
  - wait_for: { id: catalog_list:1-Loading%20fixture }
  - select: { id: catalog_list:1-Loading%20fixture, index: 0 }
  - wait_for: { id: catalog_loading }
  - screenshot: { name: catalog-loading }
  - nav_back: { native: true, only_on: [uikit, mdc] }
  - nav_back: { only_on: [appkit, gtk, qt, xaml, arkui, dom] }
  - assert_missing: { id: catalog_loading }
  - assert_visible: { id: catalog_list:1-Loading%20fixture }
  - select: { id: catalog_list:1-Loading%20fixture, index: 0 }
  - wait_for: { id: catalog_loading }
  - wait_for: { id: catalog_list:2-Slow%20catalog }
  - assert_missing: { id: catalog_loading }
  - wait_for: { id: 'catalog_cover:46-http%3A%2F%2F127.0.0.1%3A18765%2Fslow-cover.jpg' }
  - screenshot: { name: catalog-covers }
  - select: { id: catalog_list:2-Slow%20catalog, index: 1 }
  - assert_text: { id: publication_title, text: Broken cover }
  - nav_back: { native: true, only_on: [uikit, mdc] }
  - nav_back: { only_on: [appkit, gtk, qt, xaml, arkui, dom] }
  - nav_back: { native: true, only_on: [uikit, mdc] }
  - nav_back: { only_on: [appkit, gtk, qt, xaml, arkui, dom] }
  - wait_for: { id: catalog_list:1-Loading%20fixture }
  - select: { id: catalog_list:1-Loading%20fixture, index: 1 }
  - wait_for: { id: catalog_error }
  - assert_missing: { id: catalog_loading }
  - nav_back: {}
  - assert_visible: { id: catalog_list:1-Loading%20fixture }
  - select: { id: catalog_list:1-Loading%20fixture, index: 2 }
  - wait_for: { id: catalog_list:2-Stanza%20test%20catalog }
  - wait_for: { id: 'catalog_cover:46-http%3A%2F%2F127.0.0.1%3A18765%2Fcover.jpg' }
  - screenshot: { name: catalog-atom-cover }
  - nav_back: { native: true, only_on: [uikit, mdc] }
  - nav_back: { only_on: [appkit, gtk, qt, xaml, arkui, dom] }
  - assert_visible: { id: catalog_list:1-Loading%20fixture }
  - menu: { id: manage_catalogs_menu }
  - wait_for: { id: 'catalog_row:http%3A%2F%2F127.0.0.1%3A18765%2Floading-fixture' }
  - context_menu: { id: 'catalog_row:http%3A%2F%2F127.0.0.1%3A18765%2Floading-fixture', item_id: catalog_remove }
  - nav_back: {}
