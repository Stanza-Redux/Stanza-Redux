    timeout_secs: 30
- web_eval:
    id: book-webview
    script: String(stanza.state().ready && !stanza.state().animating && stanza.state().height>100)
    text: 'true'
    timeout_secs: 40
- web_eval:
    id: book-webview
    script: stanza.goToChapter(2);true
    text: 'true'
    timeout_secs: 40
- web_eval:
    id: book-webview
    script: String(stanza.state().ready && stanza.state().chapter===2 && stanza.state().page===0)
    text: 'true'
    timeout_secs: 40
- web_eval:
    id: book-webview
    script: String([...document.querySelector('#book').contentDocument.images].every(i=>i.complete) && document.querySelector('#book').contentDocument.fonts.status==='loaded')
    text: 'true'
    timeout_secs: 40
- pause:
    secs: 0.7
