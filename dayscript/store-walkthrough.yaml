# SPDX-License-Identifier: AGPL-3.0-only WITH App-Fair-Distribution-Exception
# Run after sourcing tests/ci-fixture.sh. Real EPUB downloads, no public network.
# Gallery labels match the generated UI catalogs; publication text is not translated.
name: store-walkthrough
# Later captures require earlier navigation and acquisition to succeed.
on_failure: stop
flow:
- navigate:
    route: catalogs
# An interrupted locale run may have saved the fixture without reaching teardown.
# Remove only that catalog; retain the user's other catalogs and downloaded books.
- menu:
    id: manage-catalogs-menu
- wait_for:
    id: catalog-manager-list
- tap:
    id: catalog-remove-http://127.0.0.1:18765/showcase
    if_present: true
- assert_missing:
    id: catalog-remove-http://127.0.0.1:18765/showcase
- toolbar:
    item: catalog-manager-done
- menu:
    id: add-opds-catalog
- wait_for:
    id: catalog-editor-url
    timeout_secs: 30
- input:
    id: catalog-editor-url
    text: http://127.0.0.1:18765/showcase
- tap:
    id: catalog-editor-validate
- wait_for:
    id: catalog-editor-valid
    timeout_secs: 30
- tap:
    id: catalog-editor-save
- assert_missing:
    id: catalog-editor
- wait_for:
    id: catalog-list-1-Public-domain classics
    timeout_secs: 30
- wait_for:
    id: catalog-cover-46-http://127.0.0.1:18765/showcase/cover/alice
    timeout_secs: 30
- wait_for:
    id: catalog-cover-46-http://127.0.0.1:18765/showcase/cover/frankenstein
    timeout_secs: 30
- wait_for:
    id: catalog-cover-46-http://127.0.0.1:18765/showcase/cover/the-time-machine
    timeout_secs: 30
- screenshot:
    name: discover
    title:
      ar: الفهارس
      de: Kataloge
      en: Catalogs
      es: Catálogos
      fr: Catalogues
      hi: कैटलॉग
      id: Katalog
      it: Cataloghi
      ja: カタログ
      ko: 카탈로그
      pt-BR: Catálogos
      ru: Каталоги
      zh-CN: 目录
- select:
    id: catalog-list-1-Public-domain classics
    index: 0
- wait_for:
    id: publication-title
    timeout_secs: 30
- wait_for:
    id: catalog-cover-160-http://127.0.0.1:18765/showcase/cover/alice
    timeout_secs: 30
- scroll_to:
    id: download-book
- tap:
    id: download-book
- wait_for:
    id: book-webview
    timeout_secs: 60
- web_eval:
    id: book-webview
    script: String(stanza.state().ready && !stanza.state().animating && stanza.state().height>100)
    text: 'true'
    timeout_secs: 40
- web_eval:
    id: book-webview
    script: setTimeout(()=>document.getElementById('appearance').click(),300);true
    text: 'true'
    timeout_secs: 40
- wait_for:
    id: font-size
    timeout_secs: 30
- set_value:
    id: font-size
    value: 20
- set_value:
    id: line-height
    value: 1.5
- toggle:
    id: reader-justified
    value: false
- toggle:
    id: reader-hyphenation
    value: true
- screenshot:
    name: reading-settings
    title:
      ar: الإعدادات
      de: Einstellungen
      en: Settings
      es: Ajustes
      fr: Réglages
      hi: सेटिंग
