[package]
name = "stanza-redux"
version.workspace = true
edition = "2024"
license = "GPL-2.0-or-later"
# Generates typed `res::` constants from `resource/` (see build.rs).
build = "build.rs"

[features]
# `mock` keeps bare cargo and rust-analyzer compiling; `day build` overrides it with
# `--no-default-features --features <backend>` (https://daybrite.dev/docs/project-structure).
default = ["mock"]
appkit = ["day/appkit"]
gtk = ["day/gtk"]
qt = ["day/qt"]
uikit = ["day/uikit"]
material = ["day/material"]
xaml = ["day/xaml"]
winui = ["day/winui"]
arkui = ["day/arkui"]
dom = ["day/dom"]
mock = ["day/mock"]

# rlib for the desktop bin; the mobile pipeline requests staticlib/cdylib via `cargo rustc`.
[lib]
# A constant lib name: staged artifacts and the `dayapp::` import never move on a package rename.
name = "dayapp"
crate-type = ["rlib"]

[dependencies]
async-lock = "3"
futures-channel = "0.3"
day-piece-webview = "0.*"
day-part-http = "0.*"
day-piece-settings = "0.*"
day-part-filesystem = "0.*"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
roxmltree = "0.20"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
sha1 = "0.10"
percent-encoding = "2"
day = { package = "day-app", version = "0.*", features = ["model"] }
day-persistence = "0.*"

[build-dependencies]
day-build = "0.*"

# Lint policy: Clippy's default lints plus a short list that catches defects rather than style.
# The project's CI treats every warning as an error (`cargo clippy --all-targets -- -D warnings`),
# so a finding blocks the change that introduced it. Fix findings in the code; for a site where
# the lint is wrong, use `#[expect(clippy::<lint>, reason = "…")]`. A stricter table, up to
# Clippy's `pedantic` group, is the project's choice; keep these lines in it.
[dev-dependencies]
# examples/export_book.rs encodes a cover image.
base64 = "0.22"

[lints.clippy]
# Debugging and placeholder macros do not ship.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Every `unsafe` block states why it is sound in a `// SAFETY:` comment.
undocumented_unsafe_blocks = "warn"
# `unwrap()` aborts the app with no explanation. Return the error, or use `expect("…")` with the
# invariant that makes the failure impossible. Tests are exempt (clippy.toml).
unwrap_used = "warn"


[workspace]

[workspace.package]
version = "2.2.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
same-file = "1"
icu_casemap = "2"
icu_normalizer = "2"
day-sync = { version = "0.*", git = "https://github.com/daybrite/day-sync.git" }
day-sync-webdav = { version = "0.*", git = "https://github.com/daybrite/day-sync.git" }
day-piece-webdav-settings = { version = "0.*", git = "https://github.com/daybrite/day-webdav.git" }
day-part-keychain = "0.*"
futures-lite = "2"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "ico"] }
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
day-toolkit-dom = "0.*"
