제목, 저자, 장르로 보관함을 탐색하고 최근 읽던 책을 이어 보세요. 다운로드한 책과 읽던 위치는 기기에 저장됩니다. 영어판 이상한 나라의 앨리스가 포함되며 언제든 삭제할 수 있습니다.

글꼴, 크기, 여백과 간격을 조절하세요. 밝은 종이, 세피아, 어두운 종이, 사용자 지정 색상을 선택할 수 있습니다. 넓은 화면에서는 두 단으로 읽을 수 있습니다. 탭, 쓸어 넘기기, 키보드 화살표로 페이지를 넘기고 책갈피를 저장하거나 장을 검색하세요.

광고, 구매, 구독, 계정이 필요 없습니다. 카탈로그 탐색 시 해당 서버에 접속합니다. 암호화되지 않은 64 MB 이하 EPUB을 지원하며 DRM, PDF, 오디오북, 클라우드 동기화는 지원하지 않습니다.

13개 언어의 인터페이스와 Day 기반 플랫폼 기본 컨트롤. 소스 코드: github.com/Stanza-Redux/Stanza-Redux
"""
keywords = ["epub", "전자책", "독서", "책", "리더", "보관함", "opds", "오프라인", "책갈피"]
release-notes = "버전 2: 새로 만든 리더, 제목·저자·장르별 보관함, OPDS 카탈로그, 책갈피, 장 탐색, 페이지 설정. 버전 1의 13개 언어를 모두 추가했습니다. 업데이트 시 이전 앱에서 다운로드한 책을 가져옵니다."
promo = "무료 카탈로그를 탐색하고 EPUB을 오프라인으로 보관하세요. 글꼴, 간격, 색상을 직접 고를 수 있습니다."

