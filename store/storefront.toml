# Shared listing text; Day maps these locale tags and fields to each store.
[storefront.submission-info]
copyright = "2026 The App Fair Project"
contact-email = "support@appfair.org"
review-notes = """
Version 2 replaces the earlier Stanza app while retaining its bundle/package identifiers.
No sign-in, purchase, or subscription is required. First launch adds Alice’s Adventures in
Wonderland to the library; select Library > Titles, select Alice, and choose Open book.
Catalogs browses public OPDS services and can download unencrypted EPUBs. Open Book imports
an EPUB from the device. Reading works offline once a book is in the local library.
Tap the center of a reading page to show its controls. The Aa, contents, and bookmark
buttons open reading settings, chapter navigation, and saved bookmarks.
Downloaded books from v1 are imported separately without modifying the old database.
"""

[storefront.ios-uikit.apple-app-store.submission-info]
apple-category = "BOOKS"

[storefront.metadata]
name = "Stanza Redux"
marketing-url = "https://stanza-redux.app/"
support-url = "https://github.com/Stanza-Redux/Stanza-Redux/issues"
privacy-url = "https://appfair.org/privacy/"
subtitle = "EPUB reader & OPDS library"
short = "Read EPUBs offline. Browse catalogs, save bookmarks, and adjust every page."
description = """
Read a chapter on the train, find your next book in an online catalog, or settle into a two-page spread at your desk. Stanza Redux is a free, open-source EPUB reader for phones, tablets, and computers.

Bring your own EPUB files or browse OPDS catalogs, including Standard Ebooks, Project Gutenberg, and Ebooks Gratuits. Explore authors and subjects, see book details and covers, and download books into your library. You can add, validate, rename, and reorder your own catalogs.

Browse your library by title, author, or genre. Search your books, return to recently opened titles, and keep reading without an internet connection. Your reading position is saved on this device. Alice’s Adventures in Wonderland is included to get you started; you can remove it at any time.

Make the page comfortable: choose a typeface and text size, adjust margins and line and paragraph spacing, and switch between light, sepia, dark, or custom colors. Use a single column or a two-column layout on wide screens. Turn pages with taps, swipes, or keyboard arrows. Save bookmarks, search the table of contents, and jump within a chapter without losing your previous position.

No ads, purchases, subscriptions, or account required. Your library stays on your device; browsing a catalog contacts that catalog’s server. Supports unencrypted EPUB files up to 64 MB. DRM-protected books, PDF, audiobooks, and cloud synchronization are not supported.

Version 2 uses the Day framework with native controls on each platform. The interface is available in 13 languages. Source code: github.com/Stanza-Redux/Stanza-Redux
"""
keywords = ["epub", "ebook", "reader", "books", "library", "opds", "offline", "gutenberg", "bookmark", "reading", "catalog"]
release-notes = "Version 2: a rebuilt reader with library browsing by title, author and genre; OPDS catalogs; bookmarks; chapter navigation; and adjustable page layouts. Adds all 13 interface languages from version 1. Downloaded books from the previous app are imported on upgrade."
promo = "Explore free book catalogs, build an offline EPUB library, and read with the type, spacing, and colors you choose."

