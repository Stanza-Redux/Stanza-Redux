<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--paper:#f1e6cf;--ink:#493f30}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100vh;overflow:hidden;background:var(--paper);color:var(--ink)}
iframe{display:block;position:absolute;inset:0;width:100vw;height:100vh;border:0;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;border-radius:12px;min-width:44px;min-height:44px;padding:8px 12px;touch-action:manipulation}button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}button:focus-visible{outline:2px solid currentColor;outline-offset:-3px}button:disabled{opacity:.3;cursor:default}svg{width:22px;height:22px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#toolbar,#footer{position:fixed;left:0;right:0;z-index:4;display:flex;align-items:center;gap:6px;font:14px system-ui,sans-serif;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(16px);transition:opacity .18s,transform .18s}
#toolbar{top:0;padding:5px 10px;border-bottom:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}#footer{bottom:0;padding:3px 12px;justify-content:space-between;border-top:1px solid color-mix(in srgb,var(--ink) 10%,transparent)}#book-title{flex:1;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}#close-reader{display:flex;align-items:center;gap:5px}#appearance{font-family:Georgia,serif;font-size:22px}#reading-position{font-variant-numeric:tabular-nums;text-align:center;font-size:12px}
.controls-hidden #toolbar,.controls-hidden #footer{opacity:0;pointer-events:none}.controls-hidden #toolbar{transform:translateY(-100%)}.controls-hidden #footer{transform:translateY(100%)}
#contents-panel{position:fixed;inset:0;z-index:6;background:var(--paper);padding:16px max(20px,calc((100vw - 720px)/2));overflow:auto;font:16px system-ui,sans-serif}#contents-panel[hidden]{display:none}.contents-heading{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-16px;background:var(--paper);padding:12px 0}#contents-list{display:grid;gap:4px}#contents-list button{text-align:left;border-bottom:1px solid color-mix(in srgb,var(--ink) 12%,transparent);border-radius:0;padding:16px 8px}#contents-list button[aria-current=true]{font-weight:700;background:color-mix(in srgb,var(--ink) 7%,transparent)}
#hint{position:absolute;inset:0;display:grid;place-content:center;font:24px Georgia,serif}#hint[hidden],#event{display:none}#gesture-hint{position:fixed;left:12%;right:12%;bottom:66px;z-index:5;background:var(--ink);color:var(--paper);border-radius:14px;padding:14px 18px;text-align:center;font:13px/1.5 system-ui,sans-serif;pointer-events:none;animation:hint-out .3s 5s forwards}#gesture-hint[hidden]{display:none}@keyframes hint-out{to{opacity:0;visibility:hidden}}
@media(max-width:600px){#book-title{font-size:12px}#close-label{display:none}#toolbar{gap:0}}@media(prefers-reduced-motion:reduce){#toolbar,#footer{transition:none}}
</style></head><body tabindex="-1">
<div id="hint"></div><iframe id="book" sandbox="allow-same-origin allow-scripts" hidden></iframe>
<header id="toolbar">
<button id="close-reader"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg><span id="close-label"></span></button>
<span id="book-title"></span>
<button id="contents"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.1M3 12h.1M3 18h.1"/></svg></button>
<button id="appearance"></button>
</header>
<footer id="footer"><button id="previous-page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button><span id="reading-position" role="status" aria-live="polite"></span><button id="next-page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button></footer>
<aside id="contents-panel" role="dialog" aria-modal="true" aria-labelledby="contents-title" hidden><div class="contents-heading"><strong id="contents-title"></strong><button id="contents-done"></button></div><div id="contents-list"></div></aside>
<div id="gesture-hint" hidden></div><a id="event"></a><script src="styles.js"></script>
<script src="reader.js"></script></body></html>
