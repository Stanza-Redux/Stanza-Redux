<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{--paper:#f1e6cf;--ink:#493f30;--paper-rgb:241,230,207;--ink-rgb:73,63,48}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100vh;overflow:hidden;background:var(--paper);color:var(--ink)}
iframe{display:block;position:absolute;inset:0;width:100vw;height:100vh;border:0;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;border-radius:12px;min-width:44px;min-height:44px;padding:8px 12px;touch-action:manipulation}button:hover{background:rgba(var(--ink-rgb),0.08)}button:focus-visible{outline:2px solid currentColor;outline-offset:-3px}button:disabled{opacity:.3;cursor:default}svg{width:22px;height:22px;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#toolbar,#footer{position:fixed;left:0;right:0;z-index:4;display:flex;align-items:center;gap:6px;font:14px system-ui,sans-serif;background:rgba(var(--paper-rgb),0.94);backdrop-filter:blur(16px);transition:opacity .18s,transform .18s}
#toolbar{top:0;padding:5px 10px;border-bottom:1px solid rgba(var(--ink-rgb),0.1)}#footer{bottom:0;padding:3px 12px;justify-content:space-between;border-top:1px solid rgba(var(--ink-rgb),0.1)}#book-title{flex:1;text-align:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:600}#close-reader{display:flex;align-items:center;gap:5px}#appearance{font-family:Georgia,serif;font-size:22px}#reading-position{font-variant-numeric:tabular-nums;text-align:center;font-size:12px}
.controls-hidden #toolbar,.controls-hidden #footer{opacity:0;pointer-events:none}.controls-hidden #toolbar{transform:translateY(-100%)}.controls-hidden #footer{transform:translateY(100%)}
#contents-panel{position:fixed;inset:0;z-index:6;background:var(--paper);padding:16px max(20px,calc((100vw - 720px)/2));overflow:auto;font:16px system-ui,sans-serif}#contents-panel[hidden]{display:none}.contents-heading{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-16px;background:var(--paper);padding:12px 0}#contents-list{display:grid;gap:4px}#contents-list button{text-align:left;border-bottom:1px solid rgba(var(--ink-rgb),0.12);border-radius:0;padding:16px 8px}#contents-list button[aria-current=true]{font-weight:700;background:rgba(var(--ink-rgb),0.07)}
#hint{position:absolute;inset:0;display:grid;place-content:center;font:24px Georgia,serif}#hint[hidden],#event{display:none}#gesture-hint{position:fixed;left:12%;right:12%;bottom:66px;z-index:5;background:var(--ink);color:var(--paper);border-radius:14px;padding:14px 18px;text-align:center;font:13px/1.5 system-ui,sans-serif;pointer-events:none;animation:hint-out .3s 5s forwards}#gesture-hint[hidden]{display:none}@keyframes hint-out{to{opacity:0;visibility:hidden}}
@media(max-width:600px){#book-title{font-size:12px}#close-label{display:none}#toolbar{gap:0}}@media(prefers-reduced-motion:reduce){#toolbar,#footer{transition:none}}

#book-title{min-width:0}#bookmark[aria-pressed=true] svg{fill:currentColor}
#footer{flex-wrap:wrap;gap:0 6px}#progress-row{width:100%;display:flex;align-items:center;gap:10px;padding:0 10px}#chapter-progress{flex:1;min-width:0;height:24px;accent-color:var(--ink);cursor:pointer}#chapter-percent{font-size:11px;font-variant-numeric:tabular-nums;min-width:4ch;text-align:end}#position-controls{flex:1;min-width:0;text-align:center}#return-position{display:block;margin:0 auto;font-size:12px;padding:2px 8px;min-height:28px;text-decoration:underline}#position-controls{display:flex;align-items:center;justify-content:center;gap:4px}#return-position{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin:0;padding:8px;min-width:44px;min-height:44px;width:44px;text-decoration:none;background:rgba(var(--ink-rgb),0.07)}#return-position[hidden]{display:none}
#contents-panel{overscroll-behavior:contain}.contents-tabs{display:flex;gap:8px;margin-bottom:12px}.contents-tabs button{flex:1;border:1px solid rgba(var(--ink-rgb),0.2)}.contents-tabs button[aria-pressed=true]{background:var(--ink);color:var(--paper)}#contents-search{width:100%;padding:12px;margin-bottom:12px;border:1px solid rgba(var(--ink-rgb),0.25);border-radius:10px;background:transparent;color:inherit;font:inherit}#bookmarks-list{display:grid;gap:6px}.bookmark-row{display:flex;align-items:center;border-bottom:1px solid rgba(var(--ink-rgb),0.12)}.bookmark-row .bookmark-jump{flex:1;text-align:start;min-width:0;padding:14px 8px}.bookmark-jump strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}.bookmark-jump small{display:block;opacity:.7;margin-top:5px;font-variant-numeric:tabular-nums}#contents-empty,#bookmarks-empty{opacity:.7;line-height:1.6}#contents-list button[hidden],#contents-list[hidden],#bookmarks-list[hidden]{display:none}
/* Keep chrome clear of notches, home indicators and the on-screen keyboard. */
html,body{height:100dvh}iframe{height:100dvh}
#toolbar{padding-top:calc(5px + env(safe-area-inset-top));padding-left:calc(10px + env(safe-area-inset-left));padding-right:calc(10px + env(safe-area-inset-right))}
#footer{padding-bottom:calc(3px + env(safe-area-inset-bottom));padding-left:calc(12px + env(safe-area-inset-left));padding-right:calc(12px + env(safe-area-inset-right))}
#contents-panel{padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.contents-heading{top:calc(-16px - env(safe-area-inset-top));padding-top:calc(12px + env(safe-area-inset-top))}
#contents-list button{text-align:start}#contents-search:focus-visible,#chapter-progress:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#position-text{min-width:0;display:flex;flex-direction:column;gap:3px}#chapter-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.7;font-size:11px}
#chapter-progress{min-height:32px}#reading-position{overflow-wrap:anywhere}
@media(prefers-reduced-motion:reduce){#gesture-hint{animation-duration:0s}}
:root[dir=rtl] #close-reader svg,:root[dir=rtl] #previous-page svg,:root[dir=rtl] #next-page svg,:root[dir=rtl] #return-position svg{transform:scaleX(-1)}
@media(forced-colors:active){button:focus-visible,#contents-search:focus-visible,#chapter-progress:focus-visible{outline:2px solid Highlight}.contents-tabs button[aria-pressed=true]{outline:2px solid Highlight}}
</style></head><body tabindex="-1">
<div id="hint"></div><iframe id="book" sandbox="allow-same-origin allow-scripts" hidden></iframe>
<header id="toolbar">
<button id="close-reader"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg><span id="close-label"></span></button>
<span id="book-title" dir="auto"></span>
<button id="contents"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.1M3 12h.1M3 18h.1"/></svg></button>
<button id="bookmark" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
<button id="appearance"></button>
</header>
<footer id="footer"><button id="previous-page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7"/></svg></button><div id="position-controls"><div id="position-text"><span id="chapter-title" dir="auto"></span><span id="reading-position" role="status" aria-live="polite"></span></div><button id="return-position" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4 3 9l5 5M3 9h11a6 6 0 0 1 0 12h-3"/></svg></button></div><button id="next-page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7"/></svg></button><div id="progress-row"><input id="chapter-progress" type="range" min="0" max="1000" step="1" value="0"><output id="chapter-percent" for="chapter-progress"></output></div></footer>
<aside id="contents-panel" role="dialog" aria-modal="true" aria-labelledby="contents-title" hidden><div class="contents-heading"><strong id="contents-title"></strong><button id="contents-done"></button></div><div class="contents-tabs"><button id="contents-tab" aria-pressed="true"></button><button id="bookmarks-tab" aria-pressed="false"></button></div><input id="contents-search" type="search"><div id="contents-list"></div><p id="contents-empty" hidden></p><div id="bookmarks-list" hidden></div><p id="bookmarks-empty" hidden></p></aside>
<div id="gesture-hint" hidden></div><a id="event"></a><script src="styles.js"></script>
<script src="reader.js"></script></body></html>
